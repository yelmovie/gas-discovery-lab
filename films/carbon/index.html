<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>탄산음료의 기포는 무엇일까?</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
/* 기체 도시 대작전 개념영상 공용 부품 — "실험 노트" 판형. 앱 색(청록·크림·금색)과 Jua 글꼴을 쓴다. */
@font-face{font-family:'Jua';src:url('assets/fonts/jua-korean-400.woff2') format('woff2');unicode-range:U+1100-11FF,U+3130-318F,U+AC00-D7AF,U+3000-303F,U+FF00-FFEF}
@font-face{font-family:'Jua';src:url('assets/fonts/jua-latin-400.woff2') format('woff2');unicode-range:U+0000-024F,U+2000-206F,U+2070-209F,U+2190-21FF}
:root{--ink:#143f43;--teal:#1f6f6c;--teal-soft:#d6ebe4;--cream:#fffdf3;--paper:#f8f3e3;--line:#dbe6dc;--gold:#c98a1c;--gold-soft:#f7cf7c;--warm:#e58a4e;--cool:#4f8fb3}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
#root{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Jua',sans-serif;color:var(--ink)}
.paper{position:absolute;inset:0;background-color:var(--paper);background-image:linear-gradient(var(--line) 2px,transparent 2px),linear-gradient(90deg,var(--line) 2px,transparent 2px);background-size:60px 60px;background-position:-2px -2px}
.paper-edge{position:absolute;left:0;top:0;bottom:0;width:70px;background:#efe6cc;border-right:4px solid #e2d3aa}
.paper-edge i{position:absolute;left:22px;width:26px;height:26px;border-radius:50%;background:var(--paper);border:3px solid #d8c792}
#cam{position:absolute;inset:0;transform-origin:0 0}
.obj{position:absolute;display:block}
.obj img,img.obj{width:100%;height:100%;object-fit:contain}
.shadow{position:absolute;height:26px;border-radius:50%;background:#1f4a4318}
.question{position:absolute;left:150px;top:96px;display:flex;align-items:center;gap:22px;font-size:64px;line-height:1.1;color:var(--ink)}
.question b{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--gold-soft);border:5px solid var(--gold);font-size:56px;font-weight:400;color:#6b4a0c}
.question .w{display:inline-block;white-space:pre}
.tag{position:absolute;transform:translate(-50%,-100%);padding:12px 26px 14px;border-radius:18px;background:#fff;border:5px solid var(--teal);font-size:44px;line-height:1.1;white-space:nowrap;color:var(--ink);box-shadow:0 6px 0 #1f6f6c33}
.tag::after{content:'';position:absolute;left:50%;bottom:-22px;margin-left:-14px;border:14px solid transparent;border-top:14px solid var(--teal);border-bottom:0;height:0}
.tag.down{transform:translate(-50%,0)}.tag.down::after{bottom:auto;top:-22px;border-top:0;border-bottom:14px solid var(--teal)}
.tag.gold{border-color:var(--gold)}.tag.gold::after{border-top-color:var(--gold)}.tag.gold.down::after{border-bottom-color:var(--gold)}
.note{position:absolute;padding:18px 30px;border-radius:20px;background:var(--cream);border:4px dashed var(--teal);font-size:46px;line-height:1.25;color:var(--ink)}
.conclusion{position:absolute;left:50%;top:858px;transform:translateX(-50%);padding:22px 56px 26px;border-radius:28px;background:var(--cream);border:6px solid var(--teal);font-size:62px;line-height:1.1;white-space:nowrap;color:var(--ink);box-shadow:0 10px 0 #1f6f6c2e}
.conclusion em{font-style:normal;color:#9a5a10}
.soli{position:absolute;left:1560px;top:700px;width:250px;height:250px;transform-origin:50% 100%}
.soli img{width:100%;height:100%;object-fit:contain}
.flow{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible}
.flow path{fill:none;stroke-linecap:round}
.readout{position:absolute;display:grid;place-items:center;border-radius:20px;background:#163f42;color:#d9fbe8;font-size:66px;letter-spacing:2px;border:6px solid #2b6e69}
.readout span{position:absolute}

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="cam">
      <div class="paper" style="inset:-700px" data-layout-allow-overflow></div>
      <div class="shadow" style="left:820px;top:742px;width:280px"></div>
      <div class="obj" id="soda" style="left:730px;top:300px;width:460px;height:460px;"><img src="assets/prop-soda.webp" alt=""></div>
      <div class="obj" id="lid" style="left:830px;top:300px;width:260px;height:52px;z-index:2"><div style="width:100%;height:100%;border-radius:16px 16px 10px 10px;background:#1f6f6c;border:5px solid #123f3d"></div></div>
      <div class="obj" id="bubbles" style="left:850px;top:380px;width:220px;height:330px;z-index:1"><svg viewBox="0 0 220 330" width="220" height="330"><circle class="bb" id="bb0" cx="40" cy="300" r="14" fill="#ffffff" fill-opacity=".85" stroke="#3f7fa6" stroke-width="5" opacity="0"/><circle class="bb" id="bb1" cx="80" cy="320" r="11" fill="#ffffff" fill-opacity=".85" stroke="#3f7fa6" stroke-width="5" opacity="0"/><circle class="bb" id="bb2" cx="115" cy="290" r="16" fill="#ffffff" fill-opacity=".85" stroke="#3f7fa6" stroke-width="5" opacity="0"/><circle class="bb" id="bb3" cx="150" cy="312" r="12" fill="#ffffff" fill-opacity=".85" stroke="#3f7fa6" stroke-width="5" opacity="0"/><circle class="bb" id="bb4" cx="185" cy="300" r="11" fill="#ffffff" fill-opacity=".85" stroke="#3f7fa6" stroke-width="5" opacity="0"/><circle class="bb" id="bb5" cx="60" cy="250" r="10" fill="#ffffff" fill-opacity=".85" stroke="#3f7fa6" stroke-width="5" opacity="0"/><circle class="bb" id="bb6" cx="130" cy="262" r="12" fill="#ffffff" fill-opacity=".85" stroke="#3f7fa6" stroke-width="5" opacity="0"/><circle class="bb" id="bb7" cx="170" cy="244" r="10" fill="#ffffff" fill-opacity=".85" stroke="#3f7fa6" stroke-width="5" opacity="0"/><circle class="bb" id="bb8" cx="70" cy="300" r="13" fill="#ffffff" fill-opacity=".85" stroke="#3f7fa6" stroke-width="5" opacity="0"/><circle class="bb" id="bb9" cx="120" cy="310" r="15" fill="#ffffff" fill-opacity=".85" stroke="#3f7fa6" stroke-width="5" opacity="0"/><circle class="bb" id="bb10" cx="165" cy="296" r="12" fill="#ffffff" fill-opacity=".85" stroke="#3f7fa6" stroke-width="5" opacity="0"/></svg></div>
      <svg class="flow" viewBox="0 0 1920 1080"></svg>
      <div class="anchor" id="tag0" style="position:absolute;left:960px;top:290px;width:0;height:0;opacity:0;z-index:5"><div class="tag">물에 녹은 기체</div></div>
      <div class="anchor" id="tag1" style="position:absolute;left:1290px;top:420px;width:0;height:0;opacity:0;z-index:5"><div class="tag gold">빠져나오는 기체</div></div>
      <div class="anchor" id="tag2" style="position:absolute;left:1290px;top:560px;width:0;height:0;opacity:0;z-index:5"><div class="tag">기포 관찰</div></div>
      
      </div>
      <div class="paper-edge"><i style="top:150px"></i><i style="top:330px"></i><i style="top:510px"></i><i style="top:690px"></i><i style="top:870px"></i></div>
      <div class="question" id="q"><b>?</b><span><span class="w">탄산음료의 </span><span class="w">기포는 </span><span class="w">무엇일까? </span></span></div>
      <div id="conclusion" style="position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0"><div class="conclusion">녹아 있던 <em>이산화탄소</em>가 기포로 나와요</div></div>
      <div class="soli" id="soli" style="opacity:0"><img src="assets/soli.svg" alt=""></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#q .w',{opacity:0,filter:'blur(6px)'},{opacity:1,filter:'blur(0px)',duration:.16,stagger:.08,ease:'power4.out'},.15);
      tl.fromTo("#q b",{"scale":0.6,"opacity":0},{"scale":1,"opacity":1,"duration":0.45,"ease":"back.out(1.7)"},0.1);
      tl.fromTo("#tag0",{"opacity":0,"y":14},{"opacity":1,"y":0,"duration":0.4,"ease":"expo.out"},1.1);
      tl.fromTo("#tag0",{"opacity":1},{"opacity":0,"duration":0.18,"ease":"power2.in","immediateRender":false},3.75);
      tl.fromTo("#tag1",{"opacity":0,"y":14},{"opacity":1,"y":0,"duration":0.4,"ease":"expo.out"},5.1);
      tl.fromTo("#tag1",{"opacity":1},{"opacity":0,"duration":0.18,"ease":"power2.in","immediateRender":false},7.75);
      tl.fromTo("#tag2",{"opacity":0,"y":14},{"opacity":1,"y":0,"duration":0.4,"ease":"expo.out"},9.1);
      tl.fromTo("#lid",{"y":0,"rotation":0,"opacity":1},{"y":-150,"rotation":-16,"opacity":0,"duration":0.7,"ease":"power3.out"},4.2);
      tl.fromTo("#bb0",{"y":0,"opacity":1},{"y":-300,"opacity":0,"duration":1.6,"ease":"power1.in","repeat":3,"immediateRender":false},4.6);
      tl.fromTo("#bb1",{"y":0,"opacity":1},{"y":-300,"opacity":0,"duration":1.6,"ease":"power1.in","repeat":3,"immediateRender":false},4.819999999999999);
      tl.fromTo("#bb2",{"y":0,"opacity":1},{"y":-300,"opacity":0,"duration":1.6,"ease":"power1.in","repeat":3,"immediateRender":false},5.04);
      tl.fromTo("#bb3",{"y":0,"opacity":1},{"y":-300,"opacity":0,"duration":1.6,"ease":"power1.in","repeat":3,"immediateRender":false},5.26);
      tl.fromTo("#bb4",{"y":0,"opacity":1},{"y":-300,"opacity":0,"duration":1.6,"ease":"power1.in","repeat":3,"immediateRender":false},5.4799999999999995);
      tl.fromTo("#bb5",{"y":0,"opacity":1},{"y":-300,"opacity":0,"duration":1.6,"ease":"power1.in","repeat":2,"immediateRender":false},5.699999999999999);
      tl.fromTo("#bb6",{"y":0,"opacity":1},{"y":-300,"opacity":0,"duration":1.6,"ease":"power1.in","repeat":2,"immediateRender":false},5.92);
      tl.fromTo("#bb7",{"y":0,"opacity":1},{"y":-300,"opacity":0,"duration":1.6,"ease":"power1.in","repeat":2,"immediateRender":false},6.14);
      tl.fromTo("#bb8",{"y":0,"opacity":0},{"y":-120,"opacity":1,"duration":1.5,"ease":"power2.out"},9.6);
      tl.fromTo("#bb9",{"y":0,"opacity":0},{"y":-160,"opacity":1,"duration":1.5,"ease":"power2.out"},9.95);
      tl.fromTo("#bb10",{"y":0,"opacity":0},{"y":-200,"opacity":1,"duration":1.5,"ease":"power2.out"},10.299999999999999);
      tl.fromTo("#cam",{"x":0,"y":0,"scale":1},{"x":-211,"y":-90,"scale":1.22,"duration":0.75,"ease":"power2.inOut"},4.9);
      tl.fromTo("#cam",{"x":-211,"y":-90,"scale":1.22},{"x":0,"y":0,"scale":1,"duration":0.6,"ease":"power2.inOut","immediateRender":false},7.65);
      tl.fromTo("#conclusion",{"opacity":0,"y":24},{"opacity":1,"y":0,"duration":0.55,"ease":"expo.out"},9);
      tl.fromTo("#q",{"opacity":1},{"opacity":0.55,"duration":0.4,"ease":"power1.out"},9);
      tl.fromTo("#soli",{"opacity":0,"scale":0.55,"y":40},{"opacity":1,"scale":1,"y":0,"duration":0.6,"ease":"back.out(1.6)"},9.35);
      tl.fromTo("#soli",{"rotation":0},{"rotation":-7,"duration":0.22,"ease":"power2.out","immediateRender":false},10.1);
      tl.fromTo("#soli",{"rotation":-7},{"rotation":0,"duration":0.4,"ease":"back.out(2)","immediateRender":false},10.32);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
